<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#1a1a2e"/>
  <!-- Thai boxing glove simplified silhouette -->
  <circle cx="256" cy="190" r="90" fill="#e94560"/>
  <!-- Glove cuff -->
  <rect x="192" y="250" width="128" height="58" rx="16" fill="#c73652"/>
  <!-- Wrist band -->
  <rect x="186" y="288" width="140" height="26" rx="10" fill="#e94560" opacity="0.7"/>
  <!-- Text label -->
  <text x="256" y="420" text-anchor="middle" font-size="58" font-weight="800"
        fill="#e94560" font-family="system-ui, sans-serif" letter-spacing="4">NAK MUAY</text>
  <text x="256" y="476" text-anchor="middle" font-size="32" font-weight="600"
        fill="#8892b0" font-family="system-ui, sans-serif" letter-spacing="6">TRAINER</text>
</svg>
